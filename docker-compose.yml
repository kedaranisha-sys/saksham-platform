version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saksham_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=False
      - SECRET_KEY=saksham-empowerment-secure-secret-2026
      # Set your Gemini API Key below or pass via .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=*
    volumes:
      # Persist SQLite database across container restarts
      - saksham_db_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
    container_name: saksham_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  saksham_db_data:
